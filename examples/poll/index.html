<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quick poll</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Should the council fund a second bus route?</h1>
  <div data-socialmesh-app><p class="note">Loading the poll…</p></div>
  <p class="note">Each phone gets one vote, under a key used only for this poll: nobody can link it to your
    name or to anything else you do. Votes are public, and counts are only a guide (anyone can make
    extra keys).</p>
</main>
</body>
